# OptimAI macOS Core Node - GitHub Actions free route
# Login: CLI prints URL (--no-open) -> user completes in own browser -> redirect URL
#        committed to code.txt -> job feeds it back into the CLI via FIFO (PKCE stays alive)
name: optimai-macos-node

on:
  workflow_dispatch:

jobs:
  mac-node:
    runs-on: macos-26
    timeout-minutes: 355
    steps:
      - name: Install OptimAI CLI
        run: |
          curl -fL https://cli-node.optimai.network/optimai_cli_darwin_universal2 -o /tmp/optimai-cli
          chmod +x /tmp/optimai-cli
          sudo mv /tmp/optimai-cli /usr/local/bin/optimai-cli
          optimai-cli --version || true

      - name: Start Docker setup in background (colima first, Docker Desktop fallback)
        run: |
          cat > /tmp/docker_setup.sh <<'SCRIPT'
          #!/bin/bash
          echo "=== docker setup started at $(date) ==="
          brew install docker colima
          echo "--- trying colima with vz ---"
          colima start --cpu 3 --memory 6 --vm-type vz --mount-type virtiofs 2>&1 | tail -20
          if docker info >/dev/null 2>&1; then
            echo "DOCKER_READY_VIA_VZ"
            exit 0
          fi
          echo "--- colima vz failed, trying qemu ---"
          colima delete -f 2>/dev/null || true
          colima start --cpu 2 --memory 4 --vm-type qemu 2>&1 | tail -20
          if docker info >/dev/null 2>&1; then
            echo "DOCKER_READY_VIA_QEMU"
            exit 0
          fi
          echo "--- colima failed, trying Docker Desktop ---"
          brew install --cask docker || true
          /usr/bin/open -a Docker || true
          for i in $(seq 1 60); do
            if docker info >/dev/null 2>&1; then echo "DOCKER_READY_VIA_DESKTOP"; exit 0; fi
            sleep 10
          done
          echo "DOCKER_ALL_FAILED"
          SCRIPT
          chmod +x /tmp/docker_setup.sh
          nohup /tmp/docker_setup.sh > /tmp/docker_setup.log 2>&1 &
          echo "background docker setup PID: $!"

      - name: Login (prints URL, waits for code.txt, feeds CLI via FIFO)
        env:
          CODE_FILE_URL: https://raw.githubusercontent.com/sahinealam/optimai-node/main/code.txt
        run: |
          set -x
          rm -f /tmp/login_fifo /tmp/login_out.log /tmp/paste_input.txt /tmp/fetched_code.txt
          mkfifo /tmp/login_fifo
          ( sleep 4000 > /tmp/login_fifo ) &
          KEEPER=$!
          echo "KEEPER=$KEEPER"
          PYTHONUNBUFFERED=1 optimai-cli auth login --no-open --paste < /tmp/login_fifo > /tmp/login_out.log 2>&1 &
          CLI_PID=$!
          echo "CLI_PID=$CLI_PID"
          for i in $(seq 1 45); do
            if grep -q "Open this URL" /tmp/login_out.log 2>/dev/null; then break; fi
            sleep 2
          done
          echo "================ LOGIN URL BELOW ================"
          cat /tmp/login_out.log
          echo "================ LOGIN URL ABOVE ================"
          FOUND=""
          for i in $(seq 1 160); do
            if [ -s /tmp/paste_input.txt ]; then FOUND=1; echo "code file already present"; break; fi
            if ! kill -0 $CLI_PID 2>/dev/null; then echo "CLI exited early:"; cat /tmp/login_out.log; break; fi
            curl -fsSL --max-time 20 "$CODE_FILE_URL" -o /tmp/fetched_code.txt 2>/dev/null || true
            if [ -s /tmp/fetched_code.txt ]; then
              cp /tmp/fetched_code.txt /tmp/paste_input.txt
              FOUND=1
              echo "code fetched from repo"
              break
            fi
            sleep 15
          done
          if [ -n "$FOUND" ]; then
            echo "Feeding pasted URL into CLI..."
            cat /tmp/paste_input.txt > /tmp/login_fifo
            for i in $(seq 1 90); do
              if grep -q "Authenticated" /tmp/login_out.log 2>/dev/null; then echo "LOGIN_OK"; break; fi
              if ! kill -0 $CLI_PID 2>/dev/null; then break; fi
              sleep 5
            done
          else
            echo "::warning::No paste input received in time"
          fi
          echo "===== FINAL LOGIN OUTPUT ====="
          cat /tmp/login_out.log
          echo "=============================="
          kill $KEEPER 2>/dev/null || true
          optimai-cli auth status || true

      - name: Start OptimAI node
        run: |
          echo "--- waiting for docker (background setup) ---"
          DOCKER_OK=""
          for i in $(seq 1 60); do
            if docker info >/dev/null 2>&1; then DOCKER_OK=1; break; fi
            sleep 10
          done
          if [ -n "$DOCKER_OK" ]; then
            echo "Docker is ready:"
            docker version
            echo "--- starting node ---"
            optimai-cli node start || true
            optimai-cli node status || true
          else
            echo "DOCKER NOT READY"
            tail -60 /tmp/docker_setup.log || true
            echo "::warning::Docker unavailable on this runner"
          fi

      - name: Keep node running and monitor
        if: always()
        run: |
          for i in $(seq 1 55); do
            echo "=== status check $i at $(date) ==="
            optimai-cli node status || true
            docker ps || true
            sleep 300
          done
