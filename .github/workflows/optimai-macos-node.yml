# OptimAI macOS Core Node - GitHub Actions (free route)
name: optimai-macos-node

on:
  workflow_dispatch:

jobs:
  mac-node:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Platform info
        run: |
          sw_vers
          uname -m

      - name: Install OptimAI CLI
        run: |
          curl -fL https://cli-node.optimai.network/optimai_cli_darwin_universal2 -o /tmp/optimai-cli
          chmod +x /tmp/optimai-cli
          sudo mv /tmp/optimai-cli /usr/local/bin/optimai-cli
          optimai-cli --version || true

      - name: Login (paste mode - check logs for URL/code!)
        run: |
          optimai-cli auth login --paste || echo "LOGIN_EXIT_CODE: $?"

      - name: Docker and node attempt
        if: always()
        run: |
          brew install --cask docker || echo "docker cask install failed"
          ls /Applications | grep -i docker || true
          nohup open -a Docker >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker is RUNNING"
              docker --version
              break
            fi
            echo "waiting for docker... ($i/30)"
            sleep 10
          done
          docker info || echo "::warning::Docker unavailable on this runner"
          if docker info >/dev/null 2>&1; then
            echo "Starting OptimAI node..."
            optimai-cli node start || true
          else
            echo "Docker unavailable - cannot start node on this runner"
            optimai-cli node status || true
          fi
