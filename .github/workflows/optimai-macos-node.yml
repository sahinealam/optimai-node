# OptimAI macOS Core Node - GitHub Actions (free route)
name: optimai-macos-node

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Redirected URL (or code param) from browser login'
        required: false
        default: ''

jobs:
  mac-node:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Platform info
        run: |
          sw_vers
          uname -m

      - name: Install OptimAI CLI
        run: |
          curl -fL https://cli-node.optimai.network/optimai_cli_darwin_universal2 -o /tmp/optimai-cli
          chmod +x /tmp/optimai-cli
          sudo mv /tmp/optimai-cli /usr/local/bin/optimai-cli
          optimai-cli --version || true

      - name: Login (intercept browser open to capture URL)
        env:
          CODE: ${{ github.event.inputs.code }}
        run: |
          # Shadow the macOS open command so the CLI login URL is printed instead of opened
          printf '#!/bin/bash\necho "OPEN_CALLED: $@"\nexit 0\n' > /usr/local/bin/open
          chmod +x /usr/local/bin/open
          if [ -n "$CODE" ]; then
            echo "Feeding provided redirect URL into CLI..."
            echo "$CODE" | optimai-cli auth login --paste || echo "LOGIN_EXIT: $?"
          else
            echo "Phase 1: capturing login URL..."
            optimai-cli auth login --paste || echo "LOGIN_EXIT: $?"
          fi
          echo "--- state files ---"
          ls -la ~/.optimai 2>/dev/null || true
          find ~ -maxdepth 3 -iname "*optimai*" 2>/dev/null | head -20 || true

      - name: Docker attempt (for later node start)
        if: always() && github.event.inputs.code != ''
        run: |
          rm -f /usr/local/bin/open
          brew install --cask docker || echo "docker cask install failed"
          nohup /usr/bin/open -a Docker >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker is RUNNING"
              docker --version
              break
            fi
            echo "waiting for docker... ($i/30)"
            sleep 10
          done
          if docker info >/dev/null 2>&1; then
            optimai-cli node start || true
            optimai-cli node status || true
          else
            echo "::warning::Docker unavailable on this runner"
          fi
